<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Seite nicht gefunden</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: var(--spacing-lg);
        }

        .error-content h1 {
            font-size: 5rem;
            color: var(--accent-orange);
            margin-bottom: var(--spacing-md);
        }

        .error-content h2 {
            font-size: 1.8rem;
            margin-bottom: var(--spacing-md);
        }

        .error-content p {
            font-size: 1.1rem;
            margin-bottom: var(--spacing-lg);
        }

        .error-button {
            display: inline-block;
            background-color: var(--primary-blue);
            color: var(--bg-white);
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .error-button:hover {
            background-color: var(--accent-orange);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">dobetr<span class="logo-de">.de</span></h1>
                <p class="tagline">PACE – Mental Performance Assessment</p>
            </div>
        </div>
    </header>

    <!-- Error Content -->
    <div class="error-container">
        <div class="error-content">
            <h1>404</h1>
            <h2>Seite nicht gefunden</h2>
            <p>Die angeforderte Seite existiert nicht oder wurde verschoben.</p>
            <a href="/" class="error-button">Zurück zur Startseite</a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-note">dobetr.de – Mental Performance Assessment</p>
        </div>
    </footer>
</body>
</html>
